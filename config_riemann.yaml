data: "./data/"  # cohort .yaml files + HDF5 epochs
sfreq: 128  # sampling frequency in Hertz
duration: 1  # duration of epochs in seconds
epochs: 10  # number of epochs to extract
resolution: 64  # number of spatial features (pooled from tangent space)
overwrite: True  # overwrite HDF5 epochs?
transform_type: "riemann"  # '2d' topomap, '3d' spherical harmonics, 'riemann' tangent space
window: 32  # covariance window in samples (32 = 250ms at 128Hz)
step: 1  # stride in samples (1 = maximum temporal resolution)
