data: "./data/"  # cohort .yaml files + HDF5 epochs
sfreq: 128  # sampling frequency in Hertz
duration: 1  # duration of epochs in seconds
epochs: 10  # number of epochs to extract
resolution: 64  # number of ROIs (Ward clustering on cortical surface)
overwrite: True  # overwrite HDF5 epochs?
transform_type: "source"  # '2d' topomap, '3d' SH, 'riemann' tangent space, 'source' parcellation
# parc: "aparc"  # optional: use atlas instead of dynamic clustering ('aparc' or 'aparc.a2009s')
method: "dSPM"  # inverse method: 'MNE', 'dSPM', 'sLORETA', 'eLORETA'
snr: 3.0  # assumed signal-to-noise ratio for regularization
